name: Installer
on:
  push:
    branches: [main]
    paths:
      - deploy/installer/**
      - tools/build_installer.py
      - tools/check_installer.py
      - tools/check_panel_setup.py
      - tgwitness/panelctl.py
      - tgwitness/operator_guide.py
      - .github/workflows/installer.yml
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and verify installer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare an isolated builder
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-installer-builder"
          echo "$RUNNER_TEMP/tgwitness-installer-builder/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-installer-builder" >> "$GITHUB_ENV"
      - run: python -m pip install --require-hashes -r deploy/build.lock
      - run: python -m pip install -c deploy/constraints.txt cryptography
      - run: python -I tools/check_panel_setup.py
      - name: Build installers and download page
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.TGWITNESS_INSTALLER_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$INSTALLER_SIGNING_KEY" || { echo 'Configure the reviewed installer signing key first.'; exit 1; }
          printf '%s\n' "$INSTALLER_SIGNING_KEY" > "$RUNNER_TEMP/tgwitness-release.pem"
          python tools/build_installer.py --base-url https://get.destroy.tools --signing-key "$RUNNER_TEMP/tgwitness-release.pem"
      - name: Remove the private build key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/tgwitness-release.pem"
      - name: Verify artifacts and perform an isolated Linux installation
        run: python tools/check_installer.py --install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tgwitness-installer-site
          path: dist/installer-site/
          retention-days: 7
