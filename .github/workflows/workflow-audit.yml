name: Workflow security audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the signing workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Upload zizmor SARIF to code scanning.
    steps:
      - name: Checkout workflows for static analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python with safe module search paths
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Audit workflows and upload SARIF
        id: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        # The composite runs python -m pip/zipfile. Never import modules or
        # startup hooks from the repository being inspected.
        env:
          PYTHONSAFEPATH: '1'
          PYTHONPATH: ''
        with:
          version: 1.31.1
          inputs: .github
          persona: auditor
          advanced-security: true
        # This pinned composite generates SARIF and uploads it with
        # github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3.
        # A second upload of the same tool/category would duplicate the analysis.
      - name: Make findings available outside the Security dashboard
        if: ${{ !cancelled() && steps.zizmor.outputs.output-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-audit-sarif
          path: ${{ steps.zizmor.outputs.output-file }}
          if-no-files-found: error
          retention-days: 14
