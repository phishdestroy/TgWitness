<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>TgWitness · Signed Telegram export</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/sealed.css"><script src="/theme.js"></script></head>
<body>
<header class="runner-header"><a class="brand" href="/"><img src="/mark.svg" width="32" height="32" alt="">TgWitness</a><div class="preferences">
<select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option></select>
<div class="theme-pick" role="group" aria-label="Theme"><button type="button" data-theme-choice="light" aria-label="Light theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg></button><button type="button" data-theme-choice="dark" aria-label="Dark theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15A8 8 0 1 1 9 4a7 7 0 0 0 11 11Z"/></svg></button></div></div></header>
<main class="runner-page"><span class="eyebrow" data-en="TEMPORARY CAPTURE · GITHUB ACTIONS" data-ru="ВРЕМЕННАЯ ВЫГРУЗКА · GITHUB ACTIONS"></span>
<h1 data-en="Export your Telegram data" data-ru="Выгрузите данные Telegram"></h1>
<p class="page-description" data-en="Sign in, choose your export settings and start. When it finishes, return to the helper to open your encrypted archive." data-ru="Войдите, выберите настройки выгрузки и запустите её. После завершения вернитесь в помощник, чтобы открыть зашифрованный архив."></p>
<p id="error" class="notice error" role="alert"></p><p id="status" class="notice" role="status" aria-live="polite"></p>
<section class="card padded" id="login" hidden><h2 data-en="Sign in to Telegram" data-ru="Вход в Telegram"></h2>
<p class="hint" data-en="The built-in API credential pool is used by default, just like the normal workspace. You can sign in without entering API credentials." data-ru="По умолчанию используется встроенный пул учетных данных API, так же как и в обычном рабочем пространстве. Вы можете войти в систему без ввода учетных данных API."></p>
<details id="custom-api"><summary data-en="Use my own API credentials (optional)" data-ru="Использовать мои собственные учетные данные для API (необязательно)"></summary>
<p class="hint" data-en="Leave both fields empty to use the built-in pool. To use your own credentials, enter both fields. They are used inside this temporary runner and are never entered into the GitHub form." data-ru="Оставьте оба поля пустыми, чтобы использовать встроенный пул. Чтобы использовать собственные учетные данные, заполните оба поля. Они используются внутри этого временного запуска и никогда не передаются в форму GitHub."></p>
<div class="runner-api"><div><label for="api-id">API ID</label><input id="api-id" inputmode="numeric" autocomplete="off" aria-describedby="api-error"></div><div><label for="api-hash">API hash</label><input id="api-hash" type="password" autocomplete="off" aria-describedby="api-error"></div></div>
<p id="api-error" hidden data-en="Enter a valid API ID and a 32-character hexadecimal API hash, or leave both fields empty." data-ru="Введите действительный идентификатор API и 32-символьный шестнадцатеричный хеш API или оставьте оба поля пустыми."></p>
<p><a href="https://my.telegram.org/apps" target="_blank" rel="noreferrer" data-en="Get API credentials at my.telegram.org" data-ru="Получить API-пару на my.telegram.org"></a></p></details>
<button class="secondary" id="qr" data-en="Sign in with QR" data-ru="Войти по QR-коду"></button><img id="qr-image" alt="Telegram login QR" hidden>
<div class="runner-phone"><label for="phone" data-en="Or enter your phone number, including country code" data-ru="Или введите телефон с кодом страны"></label><input id="phone" type="tel" autocomplete="off" placeholder="+…"><button class="primary" id="send-code" data-en="Get login code" data-ru="Получить код входа"></button></div>
<div id="code-box" hidden><label for="code" data-en="Code from Telegram" data-ru="Код из Telegram"></label><input id="code" autocomplete="one-time-code" inputmode="numeric"><button class="primary" id="confirm-code" data-en="Confirm code" data-ru="Подтвердить код"></button></div>
<div id="password-box" hidden><label for="password" data-en="Telegram two-step verification password" data-ru="Пароль двухэтапной проверки Telegram"></label><input id="password" type="password" autocomplete="off"><button class="primary" id="confirm-password" data-en="Confirm password" data-ru="Подтвердить пароль"></button></div></section>
<section class="card padded" id="selection" hidden><h2 data-en="Choose what to export" data-ru="Выберите данные для выгрузки"></h2><p class="hint" data-en="The scope and settings are fixed once collection starts．All three modes use the same approved GitHub runner，signed journal and encrypted delivery．" data-ru="Состав и настройки фиксируются при запуске，все три режима используют утверждённый сборщик GitHub，подписанный журнал и зашифрованную передачу архива．"></p>
<div class="mode-comparison">
<article><h3>Telegram Takeout</h3><p data-en="Telegram’s official export mechanism．All accessible cloud chats or selected chats，dates，account data and attachments．Telegram may require export approval or a wait that exceeds this runner’s lifetime．" data-ru="Официальный механизм экспорта Telegram，можно выбрать все доступные облачные чаты или отдельные чаты，период，данные аккаунта и вложения．Telegram может запросить подтверждение и ожидание дольше срока работы этого запуска．"></p></article>
<article><h3 data-en="Regular Telegram API" data-ru="Обычный Telegram API"></h3><p data-en="The same configurable account scope without Takeout initialization．Available API methods and account data differ，Telegram rate limits still apply．This mode is never substituted for Takeout automatically．" data-ru="Настраиваемая выгрузка аккаунта без запуска Takeout，доступные методы и данные отличаются，ограничения частоты запросов Telegram сохраняются．Автоматической замены Takeout этим режимом нет．"></p></article>
<article><h3 data-en="Chat event journal" data-ru="Журнал одного чата"></h3><p data-en="History and changes observed in one chat through the regular API．Attachment rules and avatars are configurable，account categories，date filters and Desktop views do not apply．" data-ru="История и изменения одного чата，которые сборщик успел наблюдать через обычный API．Доступны настройки вложений и аватаров，категории аккаунта，фильтр дат и представления Desktop здесь не применяются．"></p></article>
</div>
<fieldset id="capture-settings"><legend data-en="Export settings" data-ru="Настройки выгрузки"></legend>
<label for="export-mode" data-en="Export mode" data-ru="Режим выгрузки"></label><select id="export-mode"><option value="takeout" data-en="Telegram Takeout · official export mechanism" data-ru="Telegram Takeout · официальный механизм экспорта"></option><option value="regular" data-en="Regular Telegram API" data-ru="Обычный Telegram API"></option><option value="journal" data-en="Chat event journal" data-ru="Журнал одного чата"></option></select>
<p id="mode-description" class="hint" role="status"></p>
<label for="export-scope" data-en="Export scope" data-ru="Состав выгрузки"></label><select id="export-scope"><option value="account" data-en="All accessible chats" data-ru="Все доступные чаты"></option><option value="chat" data-en="Selected chats" data-ru="Выбранные чаты"></option></select>
<div id="chat-picker" hidden><button class="secondary" id="refresh" data-en="Load my chats" data-ru="Загрузить мои чаты"></button><p id="dialog-note" class="hint"></p><label for="chats" data-en="Chats to include" data-ru="Чаты для выгрузки"></label><select id="chats" multiple size="6" aria-describedby="chat-help"></select><p id="chat-help" class="hint"></p></div>
<label for="export-format" data-en="Readable views included with the signed archive" data-ru="Представления внутри подписанного архива"></label><select id="export-format"><option value="telegram_both" data-en="Telegram Desktop compatible JSON and HTML" data-ru="JSON и HTML，совместимые с Telegram Desktop"></option><option value="telegram_json" data-en="Telegram Desktop compatible JSON" data-ru="JSON，совместимый с Telegram Desktop"></option><option value="telegram_html" data-en="Telegram Desktop compatible HTML" data-ru="HTML，совместимый с Telegram Desktop"></option><option value="tgwitness" data-en="TgWitness signed archive" data-ru="Подписанный архив TgWitness"></option></select>
<div id="account-options"><label for="from-date"><span data-en="From date (UTC)" data-ru="Начало периода（UTC）"></span></label><input id="from-date" type="date"><label for="through-date"><span data-en="Through date (UTC)" data-ru="Конец периода включительно（UTC）"></span></label><input id="through-date" type="date">
<label for="total-budget"><span data-en="Downloaded media budget (GiB)" data-ru="Бюджет скачивания вложений（ГиБ）"></span></label><input id="total-budget" type="number" min="1" max="1024" step="1" value="4">
<details><summary><span data-en="Chat types and message filters" data-ru="Типы чатов и фильтры сообщений"></span></summary><p class="hint"><span data-en="Applies to the selected scope. Clear every chat type to export only the account data selected below." data-ru="Фильтры применяются к выбранному составу，отключите все типы чатов，если нужны только отмеченные ниже данные аккаунта．"></span></p><label><input id="kind-private" type="checkbox" checked> <span data-en="Personal chats" data-ru="Личные чаты"></span></label><label><input id="kind-bot" type="checkbox" checked> <span data-en="Bot chats" data-ru="Чаты с ботами"></span></label><label><input id="kind-group" type="checkbox" checked> <span data-en="Basic groups" data-ru="Обычные группы"></span></label><label><input id="kind-supergroup" type="checkbox" checked> <span data-en="Supergroups" data-ru="Супергруппы"></span></label><label><input id="kind-channel" type="checkbox" checked> <span data-en="Channels" data-ru="Каналы"></span></label><label><input id="account-archived" type="checkbox" checked> <span data-en="Include archived chats" data-ru="Включить архивные чаты"></span></label><label><input id="account-own" type="checkbox"> <span data-en="Only messages sent by this account" data-ru="Только сообщения этого аккаунта"></span></label></details>
<label><input id="account-profile" type="checkbox" checked> <span data-en="Account profile" data-ru="Профиль аккаунта"></span></label><label><input id="account-contacts" type="checkbox" checked> <span data-en="Contacts" data-ru="Контакты"></span></label><label><input id="account-photos" type="checkbox"> <span data-en="Account profile photos" data-ru="Фото профиля аккаунта"></span></label><label><input id="account-stories" type="checkbox"> <span data-en="Stories" data-ru="Истории"></span></label><label><input id="account-sessions" type="checkbox"> <span data-en="Session metadata" data-ru="Сведения о сессиях"></span></label><label><input id="account-other" type="checkbox"> <span data-en="Other available account data (Takeout)" data-ru="Дополнительные данные аккаунта（Takeout）"></span></label></div>
<label for="media-action"><span data-en="Selected attachments" data-ru="Выбранные вложения"></span></label><select id="media-action"><option value="download" data-en="Download files" data-ru="Скачивать файлы"></option><option value="hashes_only" data-en="Server hashes only，no file downloads" data-ru="Только серверные хеши，без скачивания файлов"></option><option value="exclude" data-en="Messages and metadata only" data-ru="Только сообщения и метаданные"></option></select>
<label for="oversized-media"><span data-en="Files above their download size limit" data-ru="Файлы，превышающие предел скачивания"></span></label><select id="oversized-media"><option value="hashes_only" data-en="Keep server hashes" data-ru="Сохранять серверные хеши"></option><option value="exclude" data-en="Skip" data-ru="Пропускать"></option></select>
<details><summary><span data-en="File types, size limits and overrides" data-ru="Типы файлов，пределы размера и отдельные правила"></span></summary><div id="media-rules"></div></details>
<label><input id="include-avatars" type="checkbox"> <span data-en="Download participant avatars" data-ru="Скачивать аватары участников"></span></label>
<label><input id="messages-first" type="checkbox" checked> <span data-en="Read message history before processing attachments" data-ru="Сначала читать историю，затем обрабатывать вложения"></span></label>
<label><input id="preserve-ephemeral-media" type="checkbox" checked> <span data-en="Include self-destructing media from excluded types．Size limits still apply．" data-ru="Сохранять исчезающие вложения исключённых типов，включая исключённые типы．Лимит размера сохраняется．"></span></label>
<p class="hint"><span data-en="Hashes identify byte ranges of the selected photo or file. They let you compare an existing file later; they do not recreate a missing file. Avatars are a separate download choice." data-ru="Хеши относятся к диапазонам байтов выбранного фото или файла，с ними можно сравнить имеющийся файл，но восстановить отсутствующий файл нельзя．Аватары скачиваются по отдельному выбору．"></span></p>
</fieldset>
<button class="secondary" id="preflight" disabled data-en="Calculate time and size" data-ru="Рассчитать время и объём"></button><p id="preflight-result" class="hint" role="status" aria-live="polite"></p>
<p id="preflight-budget" class="hint" role="status" aria-live="polite"></p><div id="budget-actions" hidden><button class="secondary" id="budget-messages" data-en="Keep messages，skip file downloads" data-ru="Оставить сообщения без скачивания файлов"></button><button class="secondary" id="budget-chats" data-en="Choose fewer chats" data-ru="Выбрать меньше чатов"></button></div>
<button class="secondary" id="save-selection" disabled data-en="Save settings for verification" data-ru="Сохранить настройки для проверки"></button><p class="hint" data-en="After checking settings，save this JSON and agree it with the reviewer before capture．Verification can reject a different selection or a partial account export．A settings file supplied only with the final archive does not prove prior agreement．" data-ru="После проверки сохраните JSON и согласуйте его с проверяющим до сбора，при проверке можно отклонить другой состав данных или неполную выгрузку аккаунта．Файл настроек，полученный только вместе с готовым архивом，не доказывает предварительного согласования．"></p>
<details id="preflight-details" hidden><summary><span data-en="Assessment details" data-ru="Подробности проверки"></span></summary><pre id="preflight-json"></pre></details>
<p id="takeout-notice" class="hint" data-en="Takeout can require confirmation in an established Telegram session，including after phone，QR or two-step login．Telegram sets the wait，which may exceed this runner’s maximum of 120 minutes including login and approval．A new runner creates a new login and may need approval again，cross-run resume is unavailable．A persistent local export can resume the same session but does not carry GitHub attestation．" data-ru="Takeout может потребовать подтверждения в уже действующей сессии Telegram，в том числе после входа по телефону，QR или с двухэтапной проверкой．Ожидание задаёт Telegram，оно может превысить максимальные 120 минут этого запуска с учётом входа и подтверждения．Новый запуск создаёт новую сессию，продолжение между запусками недоступно．Локальная выгрузка может продолжить ту же сессию，но у неё нет аттестации GitHub．"></p>
<p class="hint" data-en="Secret Chats and inaccessible data are excluded．Cloud private chats are included when selected．This is a TgWitness export with compatible views，not a file signed by Telegram．The archive records limits，failures and any incomplete acquisition．" data-ru="Secret Chats и недоступные данные исключены，личные облачные чаты входят в выгрузку，если выбраны．Это выгрузка TgWitness с совместимыми представлениями，подпись Telegram она не содержит．Ограничения，ошибки и незавершённый сбор отражаются в архиве．"></p>
<button class="primary" id="collect" disabled data-en="Start capture" data-ru="Начать сбор"></button></section>
<section class="card padded" id="progress" hidden><h2 data-en="Capturing history and files" data-ru="Собираем историю и файлы"></h2>
<div class="runner-progress"><div><strong id="capture-messages">0</strong><span data-en="Messages" data-ru="Сообщений"></span></div><div><strong id="capture-unavailable">0</strong><span data-en="Unavailable" data-ru="Недоступно"></span></div><div><strong id="capture-remaining">—</strong><span data-en="Minutes left" data-ru="Минут осталось"></span></div></div>
<p id="capture-transfer" class="hint" role="status" hidden></p>
<p id="capture-budget" class="hint" role="status"></p>
<p class="hint" data-en="You can finish early with the data already collected. Missing history and failed downloads remain recorded in the journal." data-ru="Можно завершить раньше с уже собранными данными. Пропуски истории и ошибки загрузки останутся в журнале."></p>
<div class="runner-actions"><button class="primary" id="resume" hidden data-en="Resume paused capture" data-ru="Продолжить сбор"></button><button class="secondary" id="finish" data-en="Finish with collected data" data-ru="Завершить с собранными данными"></button></div><details><summary data-en="Detailed progress" data-ru="Подробный статус"></summary><pre id="counts"></pre></details></section>
<section class="card padded runner-complete" id="complete" hidden><h2 data-en="Return to the wizard — step 4" data-ru="Вернитесь в мастер — шаг 4"></h2><p id="complete-summary" role="status"></p><p data-en="GitHub is attesting and encrypting your archive. Wait for sealed-result in Artifacts, download and unzip it, then open delivery.tgwsealed in the wizard with your saved key." data-ru="GitHub создаёт аттестацию и шифрует архив. Дождитесь sealed-result в Artifacts, скачайте и распакуйте его, затем откройте delivery.tgwsealed в мастере своим сохранённым ключом."></p></section>
<button class="quiet" id="cancel" hidden data-en="Cancel without an archive" data-ru="Отменить без создания архива"></button>
<details><summary data-en="Privacy and capture limits" data-ru="Приватность и ограничения"></summary><p data-en="GitHub and the HTTPS tunnel remain trusted infrastructure. This is not confidential hardware. Messages deleted before capture and earlier edits cannot be recovered." data-ru="GitHub и HTTPS-туннель остаются доверенной инфраструктурой. Это не аппаратный анклав. Удалённые до сбора сообщения и прошлые правки не восстанавливаются."></p></details>
<details><summary data-en="Session details" data-ru="Сведения о запуске"></summary><pre id="context"></pre></details>
</main><script src="/sealed.js"></script></body></html>
