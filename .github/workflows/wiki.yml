name: Wiki bundle
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - docs/QUICKSTART.md
      - .github/SUPPORT.md
      - .github/SECURITY.md
      - .github/CONTRIBUTING.md
      - pyproject.toml
      - tools/build_wiki.py
      - tools/build_source.py
      - .github/workflows/wiki.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - run: python tools/build_wiki.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tgwitness-wiki
          path: |
            dist/wiki/
            dist/*-wiki.zip
            dist/*-wiki.zip.sha256
            dist/wiki-manifest.json
          if-no-files-found: error
          retention-days: 3
