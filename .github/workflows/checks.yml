name: Checks
on:
  push:
    branches: [main]
    paths:
      - tgwitness/**
      - tools/**
      - scripts/**
      - deploy/**
      - compose.yaml
      - pyproject.toml
      - start.py
      - start.sh
      - Start.cmd
      - .dockerignore
      - .gitattributes
      - .gitignore
      - .github/workflows/checks.yml
      - .github/workflows/release.yml
      - '!**/*.md'
      - '!deploy/installer/**'
      - '!tools/build_installer.py'
      - '!tools/check_installer.py'
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Also test Windows/macOS and build Windows portable (uses GitHub compute)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_platforms:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  quality:
    name: Dependencies, lint and source
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Install static-check tooling once
        run: python -m pip install "pip-audit==2.10.1" "ruff>=0.15,<1"
      - name: Audit pinned runtime dependencies against the advisory database
        run: python -m pip_audit -r deploy/constraints.txt --no-deps --disable-pip --strict --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Lint all public source
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Check bounded CI orchestration with synthetic failures
        if: ${{ !cancelled() }}
        run: python tools/check_check_runner.py
      - name: Check reviewed source and Git index for publication
        id: publication
        if: ${{ !cancelled() }}
        run: python tools/check_publication.py --git-index
      - name: Build the checked source archive
        id: source
        if: ${{ !cancelled() && steps.publication.outcome == 'success' }}
        run: python tools/build_source.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.source.outcome == 'success' && (github.event_name == 'workflow_dispatch' || inputs.full_platforms) }}
        with:
          name: tgwitness-source
          path: |
            dist/*-source.zip
            dist/*-source.zip.sha256
          retention-days: 3
  python:
    name: Python install and readiness (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full_platforms && '["linux", "windows-latest", "macos-latest"]' || '["linux"]') }}
        python: ${{ fromJSON(inputs.full_platforms && '["3.11", "3.12", "3.13"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted", "Linux", "X64", "tgwitness-ci"]') || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - run: python -m pip install -c deploy/constraints-mcp.txt -e ".[mcp]"
      - name: Check the installation and signed export with synthetic data
        run: python tools/check_install.py --package . --output build/package-smoke
      - run: python -m tgwitness --check --json --data-dir readiness-probe
      - name: Exercise the first-run installer in a fresh environment
        if: matrix.python == '3.12'
        run: |
          python start.py --setup-only
          python start.py --check --json --data-dir installer-readiness-probe
  browser:
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Install browser and MCP dependencies together
        run: python -m pip install -c deploy/constraints-mcp.txt -e ".[dev,mcp]"
      - name: Reuse the runner's versioned browser files
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - run: python -m playwright install chromium
      - name: Run independent browser checks (two at a time)
        run: python tools/run_checks.py --suite browser --jobs 2
      - name: Retain every check's logs and results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-check-results
          path: |
            build/check-results/browser/
            test-results/**/*receipt.json
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 3
  browser-ux:
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Install browser and MCP dependencies together
        run: python -m pip install -c deploy/constraints-mcp.txt -e ".[dev,mcp]"
      - name: Reuse the runner's versioned browser files
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - run: python -m playwright install chromium
      - name: Run independent panel checks (two at a time)
        run: python tools/run_checks.py --suite browser-ux --jobs 2
      - name: Check write-only form drafts
        if: ${{ !cancelled() }}
        run: python -c "from playwright._impl._driver import compute_driver_executable; import subprocess; subprocess.run([str(compute_driver_executable()[0]), 'tools/check_writeonly_drafts.mjs'], check=True)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: panel-ux-review
          path: |
            build/check-results/browser-ux/
            build/ux-review/**/*.png
            build/journal-review/**/*.png
            build/notifications-review/**/*.png
          if-no-files-found: ignore
          retention-days: 3
  portable:
    if: inputs.full_platforms
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Build the Windows portable package and check its embedded runtime
        run: python tools/build_portable.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tgwitness-windows-portable
          path: |
            dist/*-portable.zip
            dist/*-portable.zip.sha256
          retention-days: 3
  docker:
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - run: sh -n start.sh scripts/docker-start.sh
      - name: Validate source and image configurations with HTTPS
        env:
          TGWITNESS_DOMAIN: watch.example.org
          TGWITNESS_IMAGE: tgwitness:test
        run: |
          docker compose -f compose.yaml -f deploy/compose/compose.https.yaml config --quiet
          docker compose --project-directory . -f deploy/compose/compose.image.yaml -f deploy/compose/compose.https.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose/compose.proof.yaml -f deploy/compose/compose.proxies.yaml config --quiet
          docker run --rm --network none -e TGWITNESS_DOMAIN=watch.example.org \
            --mount type=bind,source="${{ github.workspace }}/deploy/Caddyfile.docker",target=/etc/caddy/Caddyfile,readonly \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # The persistent default BuildKit builder also serves the Compose check.
      # Keep its local layers; a new container builder would duplicate that cache.
      - run: docker build -f deploy/Dockerfile -t tgwitness:test .
      - name: Exercise installed container package with synthetic data
        run: >-
          docker run --rm --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          --mount type=bind,source="${{ github.workspace }}/tools",target=/checks,readonly
          tgwitness:test python /checks/check_install.py
          --package /usr/local/lib/python3.12/site-packages --output /data/checks
      - name: Check Compose health, access control, and persistent restart
        run: python tools/check_compose.py
      - name: Exercise the isolated OCR worker
        env:
          TGWITNESS_MEDIA_IMAGE: tgwitness-media:test
        run: |
          python -m pip install -c deploy/constraints.txt -e .
          docker build -f deploy/media-worker/Dockerfile -t tgwitness-media:test .
          python tools/check_media_worker.py
