name: Release packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release whose missing container should be built
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate release tag
    if: github.repository == 'phishdestroy/TgWitness' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      source_revision: ${{ steps.version.outputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - id: version
        name: Match the release tag to the package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I tools/release_source.py
  checks:
    name: Release build and package smoke
    needs: version
    uses: ./.github/workflows/checks.yml
    with:
      full_platforms: true
  security:
    name: Audit the release revision
    needs: version
    permissions:
      contents: read
      security-events: write  # upload SARIF results
    uses: ./.github/workflows/security-audit.yml
  sealed:
    name: Build sealed image and verify release pins
    needs: version
    permissions:
      contents: read
      id-token: write  # OIDC token for Sigstore signing
      attestations: write  # store the sealed image attestation
    uses: ./.github/workflows/sealed-checks.yml
  acceptance:
    name: Release acceptance (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_revision }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - name: Require the exact release revision
        id: revision
        env:
          SOURCE_REVISION: ${{ needs.version.outputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Install the hash-locked runtime and the release wheel
        id: install
        run: |
          python -m pip install --require-hashes -r deploy/build.lock
          python -m pip install -c deploy/constraints.txt --require-hashes --no-build-isolation -r deploy/requirements.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir build/wheels .
          python -m pip install --no-deps build/wheels/tgwitness-*.whl
          python -m pip check
      - name: Import the installed package and check empty-workspace readiness
        id: smoke
        run: |
          python -I -c "import tgwitness.app, tgwitness.verify, tgwitness_capture.service"
          python -I -m tgwitness --help
          python -I -m tgwitness --check --json --data-dir "$RUNNER_TEMP/readiness"
      - name: Export a synthetic journal, verify it and refuse changed copies
        id: roundtrip
        run: python -I tools/evidence_roundtrip.py
      - name: Inject media, FloodWait, cancel, handler, disk and crash faults into a synthetic workspace
        id: faults
        run: python -I tools/fault_injection.py
      - name: Record this platform result
        if: always()
        env:
          SOURCE_REVISION: ${{ needs.version.outputs.source_revision }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
          RESULT_REVISION: ${{ steps.revision.outcome }}
          RESULT_INSTALL: ${{ steps.install.outcome }}
          RESULT_SMOKE: ${{ steps.smoke.outcome }}
          RESULT_ROUNDTRIP: ${{ steps.roundtrip.outcome }}
          RESULT_FAULTS: ${{ steps.faults.outcome }}
        run: |
          mkdir -p release-acceptance
          python -I - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from importlib import metadata
          from pathlib import Path
          def version(name):
              try:
                  return metadata.version(name)
              except metadata.PackageNotFoundError:
                  return None
          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
          cell = {"os": os.environ["MATRIX_OS"], "python": os.environ["MATRIX_PYTHON"],
                  "source_revision": os.environ["SOURCE_REVISION"], "checked_out_revision": head,
                  "results": {name: os.environ["RESULT_" + name.upper()]
                              for name in ("revision", "install", "smoke", "roundtrip", "faults")},
                  "versions": {"python": sys.version.split()[0], "implementation": platform.python_implementation(),
                               "platform": platform.platform(), "machine": platform.machine(),
                               "runner_image": os.environ.get("ImageOS"), "runner_image_version": os.environ.get("ImageVersion"),
                               "tgwitness": version("tgwitness"), "pip": version("pip")},
                  "locks": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                            for name in ("deploy/build.lock", "deploy/constraints.txt", "deploy/requirements.lock")
                            if Path(name).is_file()}}
          name = cell["os"] + "-python-" + cell["python"] + ".json"
          Path("release-acceptance", name).write_text(json.dumps(cell, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: release-acceptance-${{ matrix.os }}-python-${{ matrix.python }}
          path: release-acceptance/*.json
          if-no-files-found: error
          retention-days: 30
  receipt:
    name: Bind the acceptance results to the release revision
    needs: [version, acceptance]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # attach the acceptance receipt to the release
    steps:
      - name: Download every platform result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: release-acceptance-*
          merge-multiple: true
          path: release-acceptance
      - name: Write the acceptance receipt and require every platform to pass
        env:
          SOURCE_REVISION: ${{ needs.version.outputs.source_revision }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          WORKFLOW_REVISION: ${{ github.sha }}
          MATRIX_RESULT: ${{ needs.acceptance.result }}
        run: |
          mkdir -p dist
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          systems, pythons = ("ubuntu-24.04", "windows-latest", "macos-latest"), ("3.11", "3.12", "3.13")
          revision = os.environ["SOURCE_REVISION"]
          cells, problems = [], []
          for system in systems:
              for python in pythons:
                  path = Path("release-acceptance") / (system + "-python-" + python + ".json")
                  if not path.is_file():
                      problems.append(f"{system} Python {python}: no result")
                      cells.append({"os": system, "python": python, "passed": False, "results": None})
                      continue
                  data = path.read_bytes()
                  cell = json.loads(data)
                  results = cell.get("results") or {}
                  passed = (cell.get("os") == system and cell.get("python") == python
                            and cell.get("source_revision") == revision and cell.get("checked_out_revision") == revision
                            and all(results.get(name) == "success" for name in ("revision", "install", "smoke", "roundtrip", "faults")))
                  if not passed:
                      problems.append(f"{system} Python {python}: {json.dumps(results, sort_keys=True)}")
                  cells.append({**cell, "passed": passed, "record_sha256": hashlib.sha256(data).hexdigest()})
          passed = not problems and os.environ["MATRIX_RESULT"] == "success"
          receipt = {"schema": "tgwitness-release-acceptance-v1", "version": os.environ["VERSION"],
                     "release_tag": os.environ["RELEASE_TAG"], "source_revision": revision,
                     "workflow_revision": os.environ["WORKFLOW_REVISION"], "repository": os.environ["GITHUB_REPOSITORY"],
                     "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                     "matrix": {"os": list(systems), "python": list(pythons), "result": os.environ["MATRIX_RESULT"]},
                     "passed": passed, "cells": cells}
          Path("dist/RELEASE-ACCEPTANCE.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          for problem in problems:
              print("::error::" + problem)
          if not passed:
              raise SystemExit("Release acceptance did not pass on every platform")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: tgwitness-acceptance-receipt
          path: dist/RELEASE-ACCEPTANCE.json
          if-no-files-found: warn
          retention-days: 90
      - name: Attach the acceptance receipt to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/RELEASE-ACCEPTANCE.json
  portable:
    name: Publish Windows portable package
    if: github.event_name == 'release'
    needs: [version, checks, security, sealed, acceptance, receipt]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # attach the portable package to the release
    steps:
      - name: Download the exact portable archive exercised by the release checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tgwitness-windows-portable
          path: dist
      - name: Verify the portable checksum
        working-directory: dist
        run: sha256sum --check --strict ./*-portable.zip.sha256
      - name: Attach the Windows portable package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*-portable.zip dist/*-portable.zip.sha256
  verifiers:
    name: Publish portable verifiers
    if: github.event_name == 'release'
    needs: [version, checks, security, sealed, acceptance, receipt]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # attach the portable verifiers to the release
      id-token: write  # OIDC token for the Sigstore attestation
      attestations: write  # store the build provenance of the verifiers
    steps:
      - name: Download the exact verifiers exercised by the release checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: tgwitness-verifier-*
          merge-multiple: true
          path: dist
      - name: Verify the checksums and the platform set
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum --check --strict ./*.zip.sha256
          for label in windows-amd64 linux-x86_64 macos-arm64; do
            test -f "TgWitness-verifier-$VERSION-$label-all.zip"
          done
          test "$(ls ./*.zip | wc -l)" -eq 3
      - name: Attest the build provenance of the verifiers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/TgWitness-verifier-*.zip
      - name: Attach the portable verifiers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/TgWitness-verifier-*.zip dist/TgWitness-verifier-*.zip.sha256
  packages:
    name: Publish source and Python wheel
    if: github.event_name == 'release'
    needs: [version, checks, security, sealed, acceptance, receipt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # attach the application packages to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - name: Build release downloads
        run: |
          python -m pip install --require-hashes -r deploy/build.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python tools/build_source.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for wheel in Path("dist").glob("*.whl"):
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              wheel.with_suffix(".whl.sha256").write_text(digest + "  " + wheel.name + "\n", encoding="ascii")
          PY
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.whl.sha256 dist/*-source.zip dist/*-source.zip.sha256
  container:
    name: Publish AMD64 and ARM64 container
    needs: [version, checks, security, sealed, acceptance, receipt]
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push the container image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_revision }}
          path: release-source
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build an ARM64 package for the emulated smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./release-source
          file: ./release-source/deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: tgwitness:arm64-check
      - name: Check the installed ARM64 CLI under QEMU
        run: >-
          docker run --rm --platform linux/arm64 --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          tgwitness:arm64-check python -I -m tgwitness --check --json --data-dir /tmp/readiness
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacing a published container version
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 -I tools/container_publication.py
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: image
        with:
          context: ./release-source
          file: ./release-source/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.source_revision }}
          provenance: mode=max
          sbom: true
      - name: Record the published image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Container: `%s:%s`\n\nDigest: `%s@%s`\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  manifest:
    name: Verify published downloads and publish their checksums
    if: github.event_name == 'release'
    needs: [version, portable, verifiers, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # attach the checksums to the release
    steps:
      - name: Download this release's application packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release download "$RELEASE_TAG" --dir dist
          --pattern '*-portable.zip*' --pattern '*-source.zip*' --pattern '*.whl*' --pattern 'TgWitness-verifier-*'
      - name: Verify downloaded bytes and bind the file list to the source revision
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          names = [f"TgWitness-{version}-source.zip",
                   f"TgWitness-{version}-windows-amd64-portable.zip",
                   f"tgwitness-{version}-py3-none-any.whl",
                   *(f"TgWitness-verifier-{version}-{label}-all.zip"
                     for label in ("windows-amd64", "linux-x86_64", "macos-arm64"))]
          root = Path("dist")
          expected = set(names + [name + ".sha256" for name in names])
          if {path.name for path in root.iterdir()} != expected:
              raise SystemExit("Unexpected or missing release downloads")
          files, sums = {}, []
          for name in names:
              path = root / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              line = digest + "  " + name
              if (root / (name + ".sha256")).read_text(encoding="ascii").strip() != line:
                  raise SystemExit("Release checksum mismatch: " + name)
              files[name] = {"sha256": digest, "bytes": path.stat().st_size}
              sums.append(line)
          manifest = {"schema": "tgwitness-release-v1", "version": version,
                      "source_revision": os.environ["SOURCE_REVISION"], "files": files}
          (root / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="ascii")
          (root / "RELEASE-MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="ascii")
          PY
      - name: Attach the verified download inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/SHA256SUMS.txt dist/RELEASE-MANIFEST.json
