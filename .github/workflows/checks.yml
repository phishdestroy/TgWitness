name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pip-audit==2.10.1"
      - name: Audit pinned runtime dependencies against the advisory database
        run: python -m pip_audit -r constraints.txt --no-deps --disable-pip --strict --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.15,<1"
      - run: python -m ruff check .
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m tgwitness --check --json --data-dir readiness-probe
      - name: Exercise the first-run installer in a fresh environment
        if: matrix.python == '3.12'
        run: |
          python start.py --setup-only
          python start.py --check --json --data-dir installer-readiness-probe
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_browser.py
      - run: python tools/check_account_browser.py
      - run: python tools/check_interactions_browser.py
      - run: python tools/check_workspace_browser.py
      - run: python tools/check_quick_browser.py
      - run: python tools/check_proof_browser.py
      - run: python tools/check_setup_browser.py
      - run: python tools/check_public_proxies_browser.py
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_publication.py --git-index
      - run: python tools/build_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: tgwitness-source
          path: |
            dist/*-source.zip
            dist/*-source.zip.sha256
          retention-days: 7
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Windows portable package and check its embedded runtime
        run: python tools/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: tgwitness-windows-portable
          path: |
            dist/*-portable.zip
            dist/*-portable.zip.sha256
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh -n start.sh docker-start.sh
      - name: Validate source and image configurations with HTTPS
        env:
          TGWITNESS_DOMAIN: watch.example.org
          TGWITNESS_IMAGE: tgwitness:test
        run: |
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.image.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.yaml -f compose.proof.yaml -f compose.proxies.yaml config --quiet
          docker run --rm --network none -e TGWITNESS_DOMAIN=watch.example.org \
            --mount type=bind,source="${{ github.workspace }}/deploy/Caddyfile.docker",target=/etc/caddy/Caddyfile,readonly \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -t tgwitness:test .
      - name: Exercise installed container package with synthetic data
        run: >-
          docker run --rm --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          --mount type=bind,source="${{ github.workspace }}/tools",target=/checks,readonly
          tgwitness:test python /checks/check_install.py
          --package /usr/local/lib/python3.12/site-packages --output /data/checks
      - name: Check Compose health, access control, and persistent restart
        run: python tools/check_compose.py
