name: Sealed chat capture
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Public recipient from website/sealed.html (never your private key)
        required: true
        type: string
      session_minutes:
        description: Maximum capture time (partial results are labelled)
        type: choice
        default: '30'
        options: ['30', '60', '120']
      client:
        description: API export or official Telegram Web with video
        type: choice
        default: api
        options: [api, official_web]
      official_proxy:
        description: Official Web requires an HTTP or SOCKS5 upstream, without credentials
        type: string
        default: ''
      official_egress:
        description: Proxy by default; direct exposes the runner public IP to Telegram
        type: choice
        default: proxy
        options: [proxy, direct]
      official_expected_ip:
        description: Optional required exit IP for the official client
        type: string
        default: ''

permissions:
  contents: read

jobs:
  capture:
    name: Request approved sealed capture
    permissions:
      contents: read # Let the approved collector check out its pinned source.
      id-token: write # Pass OIDC identity to the approved attestation job.
      attestations: write # Let the approved collector store its signed attestation.
    # The user owns this caller, but the verifier requires the upstream signer below.
    uses: phishdestroy/TgWitness/.github/workflows/sealed-collector.yml@65f8476e046ba3399691963e53fb64b9dae193c3 # zizmor: ignore[stale-action-refs] Internal signer commits are approved by sealed_policy.json and checked against Git history.
    with:
      recipient: ${{ inputs.recipient }}
      session_minutes: ${{ inputs.session_minutes }}
      client: ${{ inputs.client }}
      official_proxy: ${{ inputs.official_proxy }}
      official_egress: ${{ inputs.official_egress }}
      official_expected_ip: ${{ inputs.official_expected_ip }}
    secrets:
      official_proxy_username: ${{ secrets.OFFICIAL_PROXY_USERNAME }}
      official_proxy_password: ${{ secrets.OFFICIAL_PROXY_PASSWORD }}
