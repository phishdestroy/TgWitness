<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TgWitness · Sealed capture</title><link rel="stylesheet" href="/sealed.css">
<body><main>
<header><strong>TgWitness</strong><select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option></select></header>
<h1 data-en="Private chat capture" data-ru="Выгрузка закрытого чата"></h1>
<p data-en="One fresh Telegram login, one selected chat. The encrypted result appears in your GitHub run's Artifacts after collection. Keep your private key." data-ru="Новый вход в Telegram, один выбранный чат. Зашифрованный результат появится в Artifacts вашего запуска GitHub после сбора. Сохраните свой закрытый ключ."></p>
<p class="notice" data-en="GitHub and the HTTPS tunnel remain trusted infrastructure. This is not confidential hardware. Unseen deletions and earlier edits cannot be recovered; incomplete downloads are recorded." data-ru="GitHub и HTTPS-туннель остаются доверенной инфраструктурой. Это не аппаратный анклав. Удалённое до сбора и прошлые правки не восстанавливаются; пропуски загрузки фиксируются."></p>
<p id="error" role="alert"></p><p id="status" role="status" aria-live="polite"></p>
<section id="login" hidden><h2 data-en="1. Sign in to Telegram" data-ru="1. Вход в Telegram"></h2>
<label>API ID<input id="api-id" inputmode="numeric" autocomplete="off"></label>
<label>API hash<input id="api-hash" type="password" autocomplete="off"></label>
<p><a href="https://my.telegram.org/apps" target="_blank" rel="noreferrer" data-en="Get your Telegram API credentials" data-ru="Получить API-данные Telegram"></a></p>
<button id="qr" data-en="Show QR code" data-ru="Показать QR-код"></button><img id="qr-image" alt="Telegram login QR" hidden>
<label><span data-en="Or phone number, including country code" data-ru="Или телефон с кодом страны"></span><input id="phone" type="tel" autocomplete="off" placeholder="+…"></label>
<button id="send-code" data-en="Send login code" data-ru="Получить код входа"></button>
<div id="code-box" hidden><label data-en="Telegram login code" data-ru="Код входа Telegram"></label><input id="code" autocomplete="one-time-code" inputmode="numeric"><button id="confirm-code" data-en="Confirm code" data-ru="Подтвердить код"></button></div>
<div id="password-box" hidden><label data-en="Telegram two-step verification password" data-ru="Пароль двухэтапной проверки Telegram"></label><input id="password" type="password" autocomplete="off"><button id="confirm-password" data-en="Confirm password" data-ru="Подтвердить пароль"></button></div></section>
<section id="selection" hidden><h2 data-en="2. Select the chat" data-ru="2. Выберите чат"></h2>
<button id="refresh" data-en="Load chats" data-ru="Загрузить чаты"></button><p id="dialog-note"></p>
<label data-en="Chat" data-ru="Чат"></label><select id="chats"></select>
<button id="collect" disabled data-en="Collect available history and media" data-ru="Собрать доступную историю и вложения"></button></section>
<section id="progress" hidden><h2 data-en="Collection" data-ru="Сбор"></h2><pre id="counts"></pre>
<button id="resume" hidden data-en="Resume paused read" data-ru="Продолжить чтение"></button>
<button id="finish" data-en="Finish now with available data" data-ru="Завершить с уже собранными данными"></button></section>
<button id="cancel" hidden data-en="Cancel without exporting" data-ru="Отменить без выгрузки"></button>
<details><summary data-en="Session details" data-ru="Сведения о запуске"></summary><pre id="context"></pre></details>
</main><script src="/sealed.js"></script></body></html>
