name: Workflow security audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the signing workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout workflows for static analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Python with safe module search paths
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Audit workflows and upload SARIF
        id: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
        env:
          PYTHONSAFEPATH: '1'
          PYTHONPATH: ''
        with:
          version: 1.31.1
          inputs: .github
          persona: auditor
          advanced-security: true
      - name: Make findings available outside the Security dashboard
        if: ${{ !cancelled() && steps.zizmor.outputs.output-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-audit-sarif
          path: ${{ steps.zizmor.outputs.output-file }}
          if-no-files-found: error
          retention-days: 14
