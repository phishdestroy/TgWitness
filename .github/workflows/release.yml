name: Release packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release whose missing container should be built
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate release tag
    if: github.repository == 'phishdestroy/TgWitness' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      source_revision: ${{ steps.version.outputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - id: version
        name: Match the release tag to the package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I tools/release_source.py
  checks:
    name: Release build and package smoke
    needs: version
    uses: ./.github/workflows/checks.yml
    with:
      full_platforms: true
  security:
    name: Audit the release revision
    needs: version
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-audit.yml
  sealed:
    name: Build sealed image and verify release pins
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sealed-checks.yml
  portable:
    name: Publish Windows portable package
    if: github.event_name == 'release'
    needs: [version, checks, security, sealed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the exact portable archive exercised by the release checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tgwitness-windows-portable
          path: dist
      - name: Verify the portable checksum
        working-directory: dist
        run: sha256sum --check --strict ./*-portable.zip.sha256
      - name: Attach the Windows portable package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*-portable.zip dist/*-portable.zip.sha256
  packages:
    name: Publish source and Python wheel
    if: github.event_name == 'release'
    needs: [version, checks, security, sealed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - name: Build release downloads
        run: |
          python -m pip install --require-hashes -r deploy/build.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python tools/build_source.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for wheel in Path("dist").glob("*.whl"):
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              wheel.with_suffix(".whl.sha256").write_text(digest + "  " + wheel.name + "\n", encoding="ascii")
          PY
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.whl.sha256 dist/*-source.zip dist/*-source.zip.sha256
  container:
    name: Publish AMD64 and ARM64 container
    needs: [version, checks, security, sealed]
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the exact validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_revision }}
          path: release-source
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build an ARM64 package for the emulated smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./release-source
          file: ./release-source/deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: tgwitness:arm64-check
      - name: Check the installed ARM64 CLI under QEMU
        run: >-
          docker run --rm --platform linux/arm64 --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          tgwitness:arm64-check python -I -m tgwitness --check --json --data-dir /tmp/readiness
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacing a published container version
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 -I tools/container_publication.py
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: ./release-source
          file: ./release-source/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.source_revision }}
          provenance: mode=max
          sbom: true
      - name: Record the published image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Container: `%s:%s`\n\nDigest: `%s@%s`\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  manifest:
    name: Verify published downloads and publish their checksums
    if: github.event_name == 'release'
    needs: [version, portable, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this release's application packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release download "$RELEASE_TAG" --dir dist
          --pattern '*-portable.zip*' --pattern '*-source.zip*' --pattern '*.whl*'
      - name: Verify downloaded bytes and bind the file list to the source revision
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          names = [f"TgWitness-{version}-source.zip",
                   f"TgWitness-{version}-windows-amd64-portable.zip",
                   f"tgwitness-{version}-py3-none-any.whl"]
          root = Path("dist")
          expected = set(names + [name + ".sha256" for name in names])
          if {path.name for path in root.iterdir()} != expected:
              raise SystemExit("Unexpected or missing release downloads")
          files, sums = {}, []
          for name in names:
              path = root / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              line = digest + "  " + name
              if (root / (name + ".sha256")).read_text(encoding="ascii").strip() != line:
                  raise SystemExit("Release checksum mismatch: " + name)
              files[name] = {"sha256": digest, "bytes": path.stat().st_size}
              sums.append(line)
          manifest = {"schema": "tgwitness-release-v1", "version": version,
                      "source_revision": os.environ["SOURCE_REVISION"], "files": files}
          (root / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="ascii")
          (root / "RELEASE-MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="ascii")
          PY
      - name: Attach the verified download inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/SHA256SUMS.txt dist/RELEASE-MANIFEST.json
