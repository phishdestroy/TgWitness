name: First-run installer acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/installer/**
      - pyproject.toml
      - tgwitness_capture/**
      - tgwitness/panelctl.py
      - tgwitness/operator_guide.py
      - tools/build_installer.py
      - tools/check_installer*.py
      - tools/check_panel_setup.py
      - .github/workflows/installer-acceptance.yml
  workflow_dispatch:
    inputs:
      published:
        description: Install the current public downloads over HTTPS, requiring this exact main commit
        type: boolean
        default: false
  workflow_call:
    inputs:
      artifact:
        description: Installer site built and signed by the calling workflow
        type: string
        required: true
      published:
        description: Exercise authenticated public HTTPS downloads
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: installer-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: Installed panel (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mode: local
          - os: ubuntu-24.04
            mode: quick
          - os: windows-latest
            mode: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r deploy/build.lock
      - run: python -m pip install -c deploy/constraints.txt cryptography
      - run: python -I tools/check_panel_setup.py
      - name: Build with an ephemeral test key, without release credentials
        if: ${{ !inputs.artifact && !inputs.published }}
        run: python tools/build_installer.py --base-url https://installer.invalid --test-signing-key
      - name: Use the exact signed installer candidate
        if: inputs.artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist/installer-site/
      - name: Authenticate the current public downloads
        if: inputs.published
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: python tools/installer_publication.py download-current --site dist/installer-site --revision "$EXPECTED_REVISION"
      - name: Install and exercise an empty systemd panel
        if: runner.os == 'Linux'
        env:
          PANEL_TEST_MODE: ${{ matrix.mode }}
          PUBLIC_DOWNLOADS: ${{ inputs.published }}
        run: |
          options=()
          if [ "$PUBLIC_DOWNLOADS" = true ]; then options+=(--public); fi
          sudo "$(command -v python)" tools/check_installer.py --service "$PANEL_TEST_MODE" "${options[@]}"
      - name: Install with Windows PowerShell and exercise the actual panel
        if: runner.os == 'Windows'
        env:
          PUBLIC_DOWNLOADS: ${{ inputs.published }}
        run: |
          $options = @()
          if ($env:PUBLIC_DOWNLOADS -eq 'true') { $options += '--public' }
          python tools/check_installer_windows.py @options
