# Scrape configuration for TgWitness. Copy the job into prometheus.yml.
# /api/metrics answers only the main administrator: put the panel token in a
# file readable by Prometheus alone, for example with chmod 600.
scrape_configs:
  - job_name: tgwitness
    scrape_interval: 10s
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tgwitness.token
    static_configs:
      - targets: ["127.0.0.1:8787"]
