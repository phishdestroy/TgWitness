name: Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Also build and smoke-check Windows/macOS packages (uses GitHub compute)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_platforms:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  evidence:
    uses: ./.github/workflows/evidence-checks.yml
  quality:
    name: Dependencies, lint and source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
            deploy/audit.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Install static-check tooling once
        run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/audit.lock'
      - name: Audit pinned runtime dependencies against the advisory database
        run: python -m pip_audit -r deploy/constraints.txt --no-deps --disable-pip --strict --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Lint all public source
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Check standalone verifier source agreement
        if: ${{ !cancelled() }}
        run: python -I -S tools/build_standalone_verifier.py --check
      - name: Check reviewed source and Git index for publication
        id: publication
        if: ${{ !cancelled() }}
        run: python tools/publication_guard.py --git-index
      - name: Build the checked source archive
        id: source
        if: ${{ !cancelled() && steps.publication.outcome == 'success' }}
        run: python tools/build_source.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.source.outcome == 'success' && (github.event_name == 'workflow_dispatch' || inputs.full_platforms) }}
        with:
          name: tgwitness-source
          path: |
            dist/*-source.zip
            dist/*-source.zip.sha256
          retention-days: 3
  python:
    name: Python install and readiness (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full_platforms && '["linux", "windows-latest", "macos-latest"]' || '["linux"]') }}
        python: ${{ fromJSON(inputs.full_platforms && '["3.11", "3.12", "3.13"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/mcp.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Build and install the wheel with hash-locked MCP dependencies
        run: |
          python -m pip install --require-hashes -r deploy/build.lock
          python -m pip install --require-hashes --no-build-isolation -r deploy/mcp.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir build/wheels .
          python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('build/wheels').glob('tgwitness-*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)"
          python -m pip check
      - name: Import the installed package and check its CLI
        run: |
          python -I -c "import tgwitness.app, tgwitness.verify, tgwitness_capture.service"
          python -I -m tgwitness --help
      - run: python -I -m tgwitness --check --json --data-dir readiness-probe
      - name: Check the source launcher setup and empty-workspace readiness
        if: matrix.python == '3.12'
        run: |
          python start.py --setup-only
          python start.py --check --json --data-dir installer-readiness-probe
  portable:
    name: Windows portable package
    if: inputs.full_platforms
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - name: Build the Windows portable package and check its embedded runtime
        run: python tools/build_portable.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tgwitness-windows-portable
          path: |
            dist/*-portable.zip
            dist/*-portable.zip.sha256
          retention-days: 3
  docker:
    name: Container build and CLI smoke
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/constraints.txt
            deploy/constraints-mcp.txt
            deploy/build.lock
            deploy/requirements.lock
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - run: sh -n start.sh scripts/docker-start.sh
      - name: Validate source and image configurations with HTTPS
        env:
          TGWITNESS_DOMAIN: watch.example.org
          TGWITNESS_IMAGE: tgwitness:test
        run: |
          docker compose -f compose.yaml -f deploy/compose/compose.https.yaml config --quiet
          docker compose --project-directory . -f deploy/compose/compose.image.yaml -f deploy/compose/compose.https.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose/compose.proof.yaml -f deploy/compose/compose.proxies.yaml config --quiet
          docker run --rm --network none -e TGWITNESS_DOMAIN=watch.example.org \
            --mount type=bind,source="$GITHUB_WORKSPACE/deploy/Caddyfile.docker",target=/etc/caddy/Caddyfile,readonly \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -f deploy/Dockerfile -t tgwitness:test .
      - name: Check the installed container CLI without networking
        run: >-
          docker run --rm --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          tgwitness:test python -I -m tgwitness --check --json --data-dir /tmp/readiness
  media:
    name: Media worker build and import smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Build the OCR and transcription image
        run: docker build -f deploy/media-worker/Dockerfile -t tgwitness-media:test .
      - name: Import the installed worker dependencies without networking
        run: >-
          docker run --rm --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          --entrypoint python tgwitness-media:test -I -c "import faster_whisper, PIL"
