name: Release packages
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate release tag
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - id: version
        name: Match the release tag to the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Release tag must be v" + version)
          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nimage={image}\n")
          PY
  checks:
    name: Full release validation
    needs: version
    uses: ./.github/workflows/checks.yml
    with:
      full_platforms: true
  portable:
    name: Publish Windows portable package
    needs: [version, checks]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # Attach the verified portable archive to the release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - run: python tools/build_portable.py
      - name: Attach the Windows portable package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*-portable.zip dist/*-portable.zip.sha256 --clobber
  packages:
    name: Publish source, wheel and container
    needs: [version, checks]
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    permissions:
      contents: write # Attach source and wheel archives to the release.
      packages: write # Push the multi-architecture image to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - name: Build release downloads
        run: |
          python -m pip install --require-hashes -r deploy/build.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python tools/build_source.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build an ARM64 package for the emulated smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: tgwitness:arm64-check
      - name: Exercise the ARM64 container under QEMU
        run: >-
          docker run --rm --platform linux/arm64 --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp:size=128m,mode=1777
          --mount type=bind,source="$GITHUB_WORKSPACE/tools",target=/checks,readonly
          tgwitness:arm64-check python /checks/check_install.py
          --package /usr/local/lib/python3.12/site-packages --output /data/checks
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*-source.zip dist/*-source.zip.sha256 --clobber
      - name: Record the published image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Container: `%s:%s`\n\nDigest: `%s@%s`\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
