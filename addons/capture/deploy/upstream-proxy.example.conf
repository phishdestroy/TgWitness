# Copy outside the source tree, replace the parent host/port, and set CAPTURE_PROXY_CONFIG.
# Optional Squid parent credentials belong only in that private configuration file.
http_port 3128
cache_peer replace-with-your-proxy.invalid parent 3128 0 no-query default
never_direct allow all
cache deny all
cache_mem 8 MB
http_access allow all
access_log none
cache_log /tmp/squid-cache.log
pid_filename /tmp/squid.pid
shutdown_lifetime 1 seconds
