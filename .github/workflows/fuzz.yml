name: Fuzzing
on:
  pull_request:
    branches: [main]
    paths:
      - tgwitness/verifier/**
      - tgwitness/verify.py
      - fuzz/**
      - .clusterfuzzlite/**
      - deploy/installer.lock
      - .github/workflows/fuzz.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    name: Fuzz the verifier's archive and JSON parsing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build the fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: python
          github-token: ${{ github.token }}
          sanitizer: address
      - name: Run the fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 1800 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address
