name: Approved sealed collector

on:
  workflow_call:
    inputs:
      recipient:
        description: Public RSA recipient from the local setup helper; never a private key
        required: true
        type: string
      session_minutes:
        description: Capture lifetime, 10 to 120 minutes
        default: '30'
        type: string
      client:
        description: api or official_web
        default: api
        type: string
      official_proxy:
        description: Required HTTP or SOCKS5 upstream for official_web, without credentials
        default: ''
        type: string
      official_egress:
        description: proxy or explicitly selected direct, which exposes the runner public IP
        default: proxy
        type: string
      official_expected_ip:
        description: Optional required public exit IP for official_web
        default: ''
        type: string
    secrets:
      official_proxy_username:
        required: false
      official_proxy_password:
        required: false

permissions:
  contents: read

jobs:
  capture:
    name: Capture and attest approved evidence
    permissions:
      contents: read # Check out only the approved upstream collector commit.
      id-token: write # Obtain the GitHub identity for the evidence attestation.
      attestations: write # Store the attestation before encrypting the result.
    runs-on: ubuntu-24.04
    # Reserve time after the 120-minute capture for sealing, attestation and delivery.
    timeout-minutes: 220
    steps:
      # NEVER use the default checkout here: it would load the caller's fork.
      - name: Checkout approved upstream collector
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: phishdestroy/TgWitness
          ref: dbae15ec51343bc34fb0bc94031c4a8ae9bfcaed
          path: trusted-source
          persist-credentials: false
          submodules: false
      - name: Start a fresh restricted capsule
        timeout-minutes: 35
        working-directory: trusted-source
        env:
          RECIPIENT: ${{ inputs.recipient }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          CAPTURE_CLIENT: ${{ inputs.client }}
          OFFICIAL_PROXY_SERVER: ${{ inputs.official_proxy }}
          OFFICIAL_EGRESS: ${{ inputs.official_egress }}
          OFFICIAL_EXPECTED_IP: ${{ inputs.official_expected_ip }}
          OFFICIAL_PROXY_USERNAME: ${{ secrets.official_proxy_username }}
          OFFICIAL_PROXY_PASSWORD: ${{ secrets.official_proxy_password }}
        run: python3 -I scripts/sealed_runner.py start
      - name: Deliver encrypted connection
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sealed-connection
          path: ${{ runner.temp }}/tgwitness-sealed-${{ github.run_id }}-${{ github.run_attempt }}/public/connection.tgwsealed
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Wait for capture and stop network-facing processes
        id: capture
        timeout-minutes: 135
        working-directory: trusted-source
        run: python3 -I scripts/sealed_runner.py wait
      - name: Attest the fixed original archive
        timeout-minutes: 5
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.capture.outputs.subject }}
      - name: Encrypt evidence and its attestation for the recipient
        timeout-minutes: 12
        working-directory: trusted-source
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: python3 -I scripts/sealed_runner.py pack
      - name: Deliver encrypted result
        timeout-minutes: 15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sealed-result
          path: ${{ runner.temp }}/tgwitness-sealed-${{ github.run_id }}-${{ github.run_attempt }}/public/delivery*.tgwsealed
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove temporary private state
        timeout-minutes: 3
        if: always()
        working-directory: trusted-source
        run: python3 -I scripts/sealed_runner.py cleanup
