<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title description">
<title id="title">Measured Telegram export speed</title>
<desc id="description">Two fresh exports on 6 November 2026. Server A: 142.983 messages per second collecting, 127.713 across the complete export. Server B: 160.531 collecting, 141.781 complete. Two accounts per run, text and metadata through WARP, no attachments. Server A had a concurrent protected-source read.</desc>
