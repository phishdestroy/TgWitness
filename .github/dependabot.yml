version: 2
updates:
  - package-ecosystem: pip
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories:
      - /
      - /deploy
      - /deploy/compose
      - /deploy/media-worker
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      containers-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps
