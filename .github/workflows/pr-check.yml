name: PR checks
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  evidence:
    uses: ./.github/workflows/evidence-checks.yml
  website:
    name: Build public website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python tools/sync_notice.py --check
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/site.lock'
      - name: Build the isolated public site
        env:
          TGWITNESS_SITE_URL: ${{ vars.TGWITNESS_SITE_URL }}
        run: python tools/build_site.py
  lint-and-smoke:
    name: Lint and synthetic smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Check dependency lock inputs before installing code
        run: python tools/lock_requirements.py --check
      - name: Install the hash-locked build and runtime dependencies
        run: |
          python -m pip install --require-hashes -r deploy/build.lock
          python -m pip install -c deploy/constraints.txt --require-hashes --no-build-isolation -r deploy/requirements.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir build/wheels .
          python -m pip install --no-deps build/wheels/tgwitness-*.whl
          python -m pip check
          python -m pip install --require-hashes --only-binary=:all: -r deploy/audit.lock
      - run: python -m ruff check .
      - name: Check the source allowlist and build the public archive
        run: |
          python -I tools/publication_guard.py --git-index
          python -I tools/build_source.py
      - name: Import the installed package and check empty-workspace readiness
        run: |
          python -I -c "import tgwitness.app, tgwitness.verify, tgwitness_capture.service"
          python -I -m tgwitness --check --json --data-dir "$RUNNER_TEMP/readiness"
  dependencies:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/audit.lock'
      - name: Audit all pinned runtime, build and optional MCP versions without installing project code
        run: |
          mkdir -p audit-results
          status=0
          for lock in deploy/requirements.lock deploy/build.lock deploy/constraints-mcp.txt; do
            python -m pip_audit -r "$lock" --no-deps --disable-pip --strict \
              --progress-spinner off --format json --output "audit-results/$(basename "$lock").json" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr-dependency-audit
          path: audit-results/*.json
          if-no-files-found: warn
          retention-days: 7
