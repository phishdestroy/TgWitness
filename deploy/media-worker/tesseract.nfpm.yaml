name: tesseract
arch: ${NFPM_ARCH}
platform: linux
version: "5.5.4"
release: "0"
description: Tesseract OCR engine built from the hash-locked upstream source
homepage: https://github.com/tesseract-ocr/tesseract
license: Apache-2.0
depends:
  - leptonica-dev=1.87.0-r2
  - giflib=6.1.3-r4
  - libstdc++=16.2.0-r2
# build-tesseract.sh appends explicit files and symlinks. The pinned nFPM
# version's tree mode emits directory modes that apk-tools cannot read.
apk:
  signature:
    key_file: /build/tesseract-build.rsa
    key_name: tgwitness-tesseract-build
