[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tgwitness"
version = "0.6.1"
description = "Telegram observation journal with version history and signed evidence exports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PhishDestroy"}]
keywords = ["telegram", "osint", "evidence", "forensics", "telethon", "anti-fraud"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "telethon>=1.45,<2",
  "cryptography>=43,<51",
  "python-socks[asyncio]>=2.7,<4",
  "qrcode>=8.2,<9",
  "pyzipper>=0.3.6,<1",
  "apprise>=1.9,<3",
  "pillow>=13,<14",
  "requests[socks]>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.48,<2", "ruff>=0.15,<1"]
research = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[project.urls]
Homepage = "https://phishdestroy.github.io/TgWitness/"
Documentation = "https://phishdestroy.github.io/TgWitness/docs/"
Source = "https://github.com/phishdestroy/TgWitness"
Issues = "https://github.com/phishdestroy/TgWitness/issues"
Changelog = "https://github.com/phishdestroy/TgWitness/blob/main/CHANGELOG.md"

[project.scripts]
tgwitness = "tgwitness.__main__:main"

[tool.setuptools.packages.find]
include = ["tgwitness*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
tgwitness = [
  "static/*.html", "static/*.css", "static/*.js", "static/*.svg",
  "locales/ru.json", "locales/uk.json", "locales/es.json", "locales/pt.json",
  "locales/tr.json", "locales/ar.json", "locales/fa.json", "locales/ur.json",
  "locales/hi.json", "locales/id.json", "locales/vi.json", "locales/zh.json",
  "english_fallbacks.json", "public_proxies.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
