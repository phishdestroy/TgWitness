name: Standalone verifier build and import
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    name: Standalone verifier source and CLI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            deploy/build.lock
            deploy/installer.lock
      - name: Check dependency inputs and standalone verifier source agreement
        run: |
          python -I tools/lock_requirements.py --check
          python -I -S tools/build_standalone_verifier.py --check
      - name: Install the verifier cryptography dependency from its hash lock
        run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/installer.lock'
      - name: Check the standalone verifier command interface
        run: python -I tgwitness/verify.py --help
