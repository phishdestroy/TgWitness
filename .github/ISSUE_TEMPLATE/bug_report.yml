name: Bug report
description: Report a reproducible problem using a synthetic example when possible.
body:
  - type: markdown
    attributes:
      value: >-
        Do not include Telegram sessions, API credentials, tokens, private keys,
        real message content or evidence archives. See SECURITY.md for vulnerability reports.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: TgWitness version, operating system, Python/browser versions and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the steps and whether you used demo data, a fake transport or live Telegram.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include redacted error messages or screenshots made with synthetic data.
    validations:
      required: true
