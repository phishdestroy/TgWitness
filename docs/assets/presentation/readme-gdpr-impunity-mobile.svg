<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">GDPR, violated. Doctors, unpunished.</title>
<desc id="desc">Operator notice banner: a GDPR check in which the reporters were leaked, the black boxes hid nothing, the answer took 106 days and more than 5,000 pages are missing, with no consequences for the doctors. Animated illustration; static and mobile variants are available.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1c2a"/><stop offset="1" stop-color="#07131d"/></linearGradient><radialGradient id="ambient"><stop stop-color="#d4574a" stop-opacity=".18"/><stop offset="1" stop-color="#d4574a" stop-opacity="0"/></radialGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f5f3"/><stop offset="1" stop-color="#c2d4dc"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8eafc4" opacity=".16"/></pattern><filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#02070d" flood-opacity=".4"/></filter><clipPath id="frame"><rect x="1" y="1" width="638" height="478" rx="16"/></clipPath></defs>
<style>@keyframes r0{0%,6%{opacity:0;transform:translateX(-10px)}10%,94%{opacity:1;transform:none}100%{opacity:0}}.r0{animation:r0 12s ease-out infinite}@keyframes r1{0%,14%{opacity:0;transform:translateX(-10px)}18%,94%{opacity:1;transform:none}100%{opacity:0}}.r1{animation:r1 12s ease-out infinite}@keyframes r2{0%,22%{opacity:0;transform:translateX(-10px)}26%,94%{opacity:1;transform:none}100%{opacity:0}}.r2{animation:r2 12s ease-out infinite}@keyframes r3{0%,30%{opacity:0;transform:translateX(-10px)}34%,94%{opacity:1;transform:none}100%{opacity:0}}.r3{animation:r3 12s ease-out infinite}@keyframes tot{0%,44%{opacity:0}49%,94%{opacity:1}100%{opacity:0}}.tot{animation:tot 12s ease-out infinite}@keyframes st{0%,56%{opacity:0;transform:scale(2.1)}61%{opacity:1;transform:scale(.92)}64%,94%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}.stamp{transform-box:fill-box;transform-origin:center;animation:st 12s ease-in-out infinite}@keyframes live{0%,100%{opacity:.35}50%{opacity:1}}.live{animation:live 3s ease-in-out infinite}</style>
<rect x="1" y="1" width="638" height="478" rx="16" fill="url(#surface)" stroke="#3d5668"/>
<g clip-path="url(#frame)"><rect width="640" height="480" fill="url(#grid)"/><ellipse cx="512.0" cy="240.0" rx="380" ry="280" fill="url(#ambient)"/></g>
<path d="M36 1h100" stroke="#e8a598" stroke-width="2"/>
<text x="36" y="42" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#e8a598" text-anchor="start" letter-spacing="1.5" >PHISHDESTROY / TGWITNESS · OPERATOR NOTICE</text>
<text x="33" y="94" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#edf5f9" text-anchor="start" letter-spacing="-1" >GDPR, violated.</text>
<text x="33" y="136" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#d4574a" text-anchor="start" letter-spacing="-1" >Doctors, unpunished.</text>
<text x="36" y="170" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#9db3c3" text-anchor="start" letter-spacing="0" >Leaked reporters, broken redaction,</text>
<text x="36" y="192" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#9db3c3" text-anchor="start" letter-spacing="0" >106 days of stalling. No consequences.</text>
<g transform="translate(140 214) scale(.84)"><g transform="rotate(-2 215 131)" filter="url(#shadow)"><rect width="430" height="262" rx="10" fill="url(#paper)" stroke="#d8e6eb"/><text x="24" y="38" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#18364b" text-anchor="start" letter-spacing="2" >GDPR CHECK</text><text x="406" y="38" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#d4574a" text-anchor="end" letter-spacing="1.6" >FAILED</text><path d="M24 52h382" stroke="#a7bdc9"/><g class="r0"><path d="M24 69l8 8M32 69l-8 8" stroke="#d4574a" stroke-width="2.2" stroke-linecap="round"/><text x="42" y="78" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#18364b" text-anchor="start" letter-spacing="0" >Reporters protected</text><text x="406" y="78" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#d4574a" text-anchor="end" letter-spacing="0" >leaked</text></g><g class="r1"><path d="M24 95l8 8M32 95l-8 8" stroke="#d4574a" stroke-width="2.2" stroke-linecap="round"/><text x="42" y="104" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#18364b" text-anchor="start" letter-spacing="0" >Black boxes</text><text x="406" y="104" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#d4574a" text-anchor="end" letter-spacing="0" >hid nothing</text></g><g class="r2"><path d="M24 121l8 8M32 121l-8 8" stroke="#d4574a" stroke-width="2.2" stroke-linecap="round"/><text x="42" y="130" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#18364b" text-anchor="start" letter-spacing="0" >Waiting for an answer</text><text x="406" y="130" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#d4574a" text-anchor="end" letter-spacing="0" >106 days</text></g><g class="r3"><path d="M24 147l8 8M32 147l-8 8" stroke="#d4574a" stroke-width="2.2" stroke-linecap="round"/><text x="42" y="156" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#18364b" text-anchor="start" letter-spacing="0" >Complete data</text><text x="406" y="156" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#d4574a" text-anchor="end" letter-spacing="0" >5,000+ pages short</text></g><path d="M24 174h382" stroke="#7a98aa" stroke-dasharray="4 5"/><g class="tot"><text x="24" y="199" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#18364b" text-anchor="start" letter-spacing="0" >Consequences for the Doctors</text><text x="406" y="199" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#d4574a" text-anchor="end" letter-spacing="0" >none</text></g><g class="stamp"><g transform="rotate(-4 215 233)"><rect x="125" y="211" width="180" height="44" rx="6" fill="#fbe9e6" fill-opacity=".72" stroke="#d4574a" stroke-width="3.2"/><text x="215" y="241" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#d4574a" text-anchor="middle" letter-spacing="3" >IMPUNITY</text></g></g></g></g>
<path d="M36 441H604" stroke="#334d60"/>
<text x="36" y="464" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#9db3c3" text-anchor="start" letter-spacing="1.2" >TGWITNESS / OPERATOR NOTICE</text>
<text x="604" y="464" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#e8a598" text-anchor="end" letter-spacing="1.2" >READ THE OPERATOR NOTICE →</text>
</svg>
