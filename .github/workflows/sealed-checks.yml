name: Sealed capture validation
on:
  push:
    paths:
      - 'tgwitness/sealed*'
      - 'tgwitness/static/sealed*'
      - 'website/sealed*'
      - 'scripts/sealed_runner.py'
      - 'deploy/Dockerfile.sealed'
      - 'deploy/*.lock'
      - 'tests/test_sealed*'
      - 'tools/check_sealed*'
      - '.github/workflows/sealed*'
  pull_request:
    paths:
      - 'tgwitness/sealed*'
      - 'tgwitness/static/sealed*'
      - 'website/sealed*'
      - 'scripts/sealed_runner.py'
      - 'deploy/Dockerfile.sealed'
      - 'deploy/*.lock'
      - 'tests/test_sealed*'
      - 'tools/check_sealed*'
      - '.github/workflows/sealed*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sealed-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/sealed-tests"
          echo "$RUNNER_TEMP/sealed-tests/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sealed-tests/bin/python" -m pip install -c deploy/constraints.txt -e '.[dev]'
      - run: python -m pytest -q tests/test_sealed.py tests/test_sealed_workflow.py tests/test_history.py
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_sealed_browser.py
      - run: python tools/check_sealed_container.py
