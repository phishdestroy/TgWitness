version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      # Match before the generic group; include SHA-only updates as well.
      codeql:
        patterns: ["github/codeql-action/*"]
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories:
      - /
      - /deploy
      - /deploy/compose
      - /deploy/media-worker
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    # Docker interpreter upgrades need coordinated runtime and release checks.
    # Keep the tested 3.12 line; patch releases and digest updates remain eligible.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      containers-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps

# This publication contains no package.json/package-lock.json. Add an npm entry
# for the actual directory if a maintained Node package is introduced later.
# Custom deploy/*.lock hash files are regenerated by tools/lock_requirements.py;
# Dependabot's pip entry does not promise to refresh those custom files.
