name: Project website
on:
  push:
    branches: [main]
    paths:
      - NOTICE
      - LICENSE
      - tools/sync_notice.py
      - website/**
      - tools/build_site.py
      - tools/site_content.py
      - tools/site_wiki.py
      - tools/site_diagrams.py
      - tools/site_i18n.py
      - tools/site_modes.py
      - tools/site_account.py
      - tools/site_llms.py
      - docs/*.md
      - docs/ru/SEALED-ACTIONS.md
      - docs/QUICKSTART.md
      - .github/SECURITY.md
      - docs/CHANGELOG.md
      - tools/check_site.py
      - tools/check_demo_browser.py
      - tools/check_docs_site.py
      - tools/check_home_browser.py
      - tools/check_modes_browser.py
      - docs/assets/**
      - tgwitness/static/**
      - tgwitness/locales/**
      - tgwitness/guide_locales/**
      - tgwitness/english_fallbacks.json
      - pyproject.toml
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-venv"
          echo "$RUNNER_TEMP/tgwitness-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-venv" >> "$GITHUB_ENV"
      - run: python tools/sync_notice.py --check
      - run: python -m pip install 'playwright>=1.48,<2' 'markdown==3.11.2'
      - run: python -m playwright install chromium
      - name: Build the isolated public site
        env:
          TGWITNESS_SITE_URL: ${{ vars.TGWITNESS_SITE_URL }}
        run: python tools/build_site.py
      - run: python tools/check_site.py
      - run: python tools/check_docs_site.py
      - uses: actions/upload-pages-artifact@v5
        if: vars.TGWITNESS_PAGES_DEPLOYMENT == 'actions' || github.event_name == 'workflow_dispatch'
        with:
          retention-days: 1
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request' && vars.TGWITNESS_PAGES_DEPLOYMENT == 'actions'
    needs: build
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5
