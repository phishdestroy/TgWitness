name: Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: installer-publication
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify installer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare an isolated builder
        run: |
          python -m venv "$RUNNER_TEMP/tgwitness-installer-builder"
          echo "$RUNNER_TEMP/tgwitness-installer-builder/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/tgwitness-installer-builder" >> "$GITHUB_ENV"
      - run: python -m pip install --require-hashes -r deploy/build.lock
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/installer.lock'
      - name: Build installers and download page
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.TGWITNESS_INSTALLER_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$INSTALLER_SIGNING_KEY" || { echo 'Configure the reviewed installer signing key first.'; exit 1; }
          printf '%s\n' "$INSTALLER_SIGNING_KEY" > "$RUNNER_TEMP/tgwitness-release.pem"
          python tools/build_installer.py --base-url https://get.destroy.tools --signing-key "$RUNNER_TEMP/tgwitness-release.pem"
      - name: Remove the private build key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/tgwitness-release.pem"
      - name: Authenticate the signed artifact and its source revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python -I tools/installer_publication.py verify-local --revision "$EXPECTED_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tgwitness-installer-site
          path: dist/installer-site/
          retention-days: 7
  acceptance:
    name: Qualify the signed installer on Linux and Windows
    needs: build
    uses: ./.github/workflows/installer-acceptance.yml
    with:
      artifact: tgwitness-installer-site
  qualify:
    name: Require passed checks for the exact main revision
    needs: build
    if: github.repository == 'phishdestroy/TgWitness' && github.ref == 'refs/heads/main' && vars.TGWITNESS_INSTALLER_DEPLOYMENT == 'cloudflare'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.checks.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Wait for package and security checks; retain the previous download on failure
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 tools/installer_checks.py --revision "$EXPECTED_REVISION"
  publish:
    name: Publish authenticated installer to Cloudflare
    needs: [build, qualify, acceptance]
    if: needs.qualify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: installer-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tgwitness-installer-site
          path: dist/installer-site/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/installer.lock'
      - name: Check the artifact belongs to this exact source
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python -I tools/installer_publication.py verify-local --revision "$EXPECTED_REVISION"
      - name: Retain and authenticate previously published downloads
        run: python tools/installer_publication.py retain
      - name: Refuse an obsolete build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          current=$(gh api repos/phishdestroy/TgWitness/commits/main --jq .sha)
          if [ "$current" = "$EXPECTED_REVISION" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Main has advanced. Leave the published installer unchanged.'
          fi
      - name: Publish the checked static files
        if: steps.current.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure Cloudflare CI credentials before enabling publication.'; exit 1; }
          npx --yes wrangler@4.156.1 deploy --config deploy/installer/wrangler.toml
      - name: Check the public downloads after deployment
        if: steps.current.outputs.publish == 'true'
        run: python tools/installer_publication.py verify-public
