name: Project website
on:
  push:
    branches: [main]
    paths:
      - NOTICE
      - LICENSE
      - tools/sync_notice.py
      - website/**
      - tools/build_site.py
      - tools/site_content.py
      - tools/site_wiki.py
      - tools/site_diagrams.py
      - tools/site_i18n.py
      - tools/site_modes.py
      - tools/site_account.py
      - tools/site_llms.py
      - docs/*.md
      - docs/ru/SEALED-ACTIONS.md
      - docs/QUICKSTART.md
      - .github/SECURITY.md
      - docs/CHANGELOG.md
      - tools/check_site.py
      - tools/run_checks.py
      - tools/check_demo_browser.py
      - tools/check_report_example.py
      - tools/check_docs_site.py
      - tools/check_home_browser.py
      - tools/check_modes_browser.py
      - docs/assets/**
      - tgwitness/static/**
      - tgwitness/locales/**
      - tgwitness/guide_locales/**
      - tgwitness/english_fallbacks.json
      - pyproject.toml
      - deploy/site.lock
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test public website
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            deploy/site.lock
            .github/workflows/pages.yml
      - name: Create an isolated Python environment
        if: runner.os == 'Linux'
        run: |
          check_venv=$(mktemp -d "$RUNNER_TEMP/tgwitness-venv.XXXXXX")
          python -m venv "$check_venv"
          echo "$check_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$check_venv" >> "$GITHUB_ENV"
      - run: python tools/sync_notice.py --check
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/site.lock'
      - name: Reuse the runner's versioned browser files
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - run: python -m playwright install chromium
      - name: Build the isolated public site
        env:
          TGWITNESS_SITE_URL: ${{ vars.TGWITNESS_SITE_URL }}
        run: python tools/build_site.py
      - name: Check the built public pages independently (two at a time)
        run: python tools/run_checks.py --suite site --jobs 2
      - name: Retain site check results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: site-check-results
          path: |
            build/check-results/site/
            test-results/site/**/*.png
            test-results/site/**/*.json
            test-results/docs-site/**/*.png
            test-results/docs-site/**/*.json
            test-results/report-example/**/*.png
            test-results/report-example/**/*.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: vars.TGWITNESS_PAGES_DEPLOYMENT == 'actions' || github.event_name == 'workflow_dispatch'
        with:
          retention-days: 1
          path: dist/site
  deploy:
    name: Deploy checked website
    if: github.event_name != 'pull_request' && vars.TGWITNESS_PAGES_DEPLOYMENT == 'actions'
    needs: build
    runs-on: [self-hosted, Linux, X64, tgwitness-ci]
    timeout-minutes: 30
    permissions:
      pages: write # Publish the checked site through GitHub Pages.
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
